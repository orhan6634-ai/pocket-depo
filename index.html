      // Netlify'ın sağ alt köşeye enjekte ettiği harici rozeti/çekmeceyi temizle
      (function () {
        function removeInjectedHud() {
          var selectors = [
            'script[src*="/.netlify/scripts/hud"]',
            '[data-netlify-site-id]',
            '[data-nf-variant]',
            'netlify-drawer',
            'netlify-widget',
            'iframe[src*="app.netlify.com"]',
            'iframe[src*="netlify.com"]'
          ];
          selectors.forEach(function (sel) {
            document.querySelectorAll(sel).forEach(function (el) {
              el.remove();
            });
          });
          Array.from(document.body.children).forEach(function (el) {
            if (el.id !== 'root' && el.tagName !== 'SCRIPT') {
              el.style.setProperty('display', 'none', 'important');
              el.remove();
            }
          });
        }
        removeInjectedHud();
        var obs = new MutationObserver(removeInjectedHud);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
